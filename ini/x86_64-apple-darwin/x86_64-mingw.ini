[constants]
prefix = '/usr/local/opt/mingw-w64/toolchain-x86_64/'

[binaries]
c = prefix / 'bin/x86_64-w64-mingw32-gcc'
cpp = prefix / 'bin/x86_64-w64-mingw32-g++'
ar = prefix / 'bin/x86_64-w64-mingw32-ar'
strip = prefix / 'bin/x86_64-w64-mingw32-strip'
windres = prefix / 'bin/x86_64-w64-mingw32-windres'
exe_wrapper = 'wine'

[properties]
root = prefix
sys_root = prefix / 'x86_64-w64-mingw32'

[host_machine]
system = 'windows'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'
