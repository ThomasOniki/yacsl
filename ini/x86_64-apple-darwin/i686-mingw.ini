[constants]
prefix = '/usr/local/opt/mingw-w64/toolchain-i686/'

[binaries]
c = prefix / 'bin/i686-w64-mingw32-gcc'
cpp = prefix / 'bin/i686-w64-mingw32-g++'
ar = prefix / 'bin/i686-w64-mingw32-ar'
strip = prefix / 'bin/i686-w64-mingw32-strip'
windres = prefix / 'bin/i686-w64-mingw32-windres'
exe_wrapper = 'wine'

[properties]
root = prefix
sys_root = prefix / 'i686-w64-mingw32'

[host_machine]
system = 'windows'
cpu_family = 'x86'
cpu = 'i686'
endian = 'little'
